name: Deterministic checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OPENROUTER_API_KEY: ""
  LANGSMITH_TRACING: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.audit_release
      - run: python -B -m unittest discover -s tests -p 'test_mcp_server.py' -v
      - run: python -B -m scripts.verify_mcp_stdio
      - run: python -B -m unittest discover -s tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
